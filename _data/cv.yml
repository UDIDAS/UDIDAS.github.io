        summary: Research on multimodal knowledge graphs, trustworthy clinical AI, and multi-agent LLM systems.
        highlights:
          - "Image-grounded vision knowledge graphs (VKG): linking medical imaging to structured clinical context for topology-aware analysis and explainable surgical-oncology decision support"
          - "Abdominal oncology imaging-phenotype KG: ontology-grounded knowledge graphs built from abdominal CT for explainable oncology reasoning over imaging phenotypes"
          - "TrustKG: multi-agent LLM pipelines converting unstructured clinical narratives into ontology-aligned multimodal knowledge graphs, with retrieval grounding and uncertainty-aware validation"
          - "Airway digital-twin MMKG (Project GENESIS — Children's Mercy Hospital): 4D (3D + temporal) segmentation-driven knowledge graphs of pediatric airway anatomy for digital-twin modeling and clinical decision support"
          - "Corporate disclosure mining (CUNY Brooklyn collaboration): retrieval-first ML stack extracting structured disclosures from SEC 10-K filings — hybrid retrieval, NLI validation, and LoRA-adapted quantized LLM extraction"
          - "Community health web platform (Our Health Jackson County): contributed to WeListen, a React-based platform supporting regional health-disparity initiatives"

