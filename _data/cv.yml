        highlights:
          - "Trustworthy multimodal knowledge graphs (dissertation core): collaborating LLM agents transform unstructured clinical text, imaging, and segmentation into ontology-aligned multimodal knowledge graphs; vision KGs ground image-derived evidence in structured clinical context; and retrieval-grounded, uncertainty-calibrated validation (TrustKG) makes the graphs reliable enough for explainable reasoning and decision support"
          - "KG-grounded oncology reasoning (abdominal CT): ontology-grounded imaging-phenotype KGs enabling explainable oncology reasoning and surgical decision support — a multi-institutional collaboration with NKC Health and the SWOG Radiation Oncology Committee (ongoing)"
          - "Airway digital-twin MMKG (Project GENESIS, ongoing): extending the framework to 4D (3D + temporal) segmentation data — airway-anatomy knowledge graphs for digital-twin modeling and clinical decision support, in collaboration with Children's Mercy Hospital"
          - "Large-scale corporate disclosure mining engine: designed the ML stack for a financial-research collaboration with CUNY Brooklyn, extracting structured disclosures from SEC 10-K filings — a FIBO-guided, retrieval-first pipeline with hybrid retrieval, NLI validation, and a LoRA-adapted quantized LLM for field extraction"
          - "Community health web platform (Our Health Jackson County): contributed to WeListen, a React-based platform supporting regional health-disparity initiatives through community feedback and data collection"

