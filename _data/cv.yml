  summary: >
    PhD Candidate in Computer Science at UMKC. My research centers on multimodal
    knowledge graphs (MMKGs) and trustworthy medical AI — integrating clinical text,
    imaging, and segmentation into structured, ontology-grounded knowledge for
    reasoning and decision support. Interests span multimodal reasoning, knowledge
    representation, and neuro-symbolic AI, with active collaborations across surgical
    oncology, airway modeling, and clinical decision-making.

